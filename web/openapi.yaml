openapi: 3.1.0
info:
  title: interim API
  version: 2.2.0
  description: |
    interim is a temporary file host. Files expire after the instance's
    configured retention period (7 days by default), or from the last download
    when sliding retention is enabled. Admin-issued user hashes may override the
    per-file size and retention, including unlimited values. Uploads are direct to
    S3-compatible storage: interim reserves quota and signs a short-lived PUT
    URL, the client uploads the bytes, then interim verifies the object and
    commits the file record. Download URLs are short-lived: either signed S3
    GET URLs or worker-proxied token URLs, depending on the instance.
    Upload intents are public by default. When public uploads are disabled,
    only admin-approved user hashes may create them and public user-hash
    creation is unavailable.
  contact:
    name: interim
servers:
  - url: __BASE_URL__
    description: Public interim instance
tags:
  - name: Auth
    description: User hashes used as API credentials.
  - name: Uploads
    description: Create, complete, and abort direct-to-S3 upload intents.
  - name: Files
    description: Inspect, download, list, and delete committed files.
  - name: System
    description: Public service status.
paths:
  /api/v1/status:
    get:
      tags: [System]
      operationId: getStatus
      summary: Get storage and upload status
      responses:
        "200":
          description: Current service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/v1/keys:
    post:
      tags: [Auth]
      operationId: createUserHash
      summary: Create a user hash
      description: Creates a bearer credential. The raw hash is returned once and never stored in plaintext. Disabled when public uploads are off; new hashes are unapproved for restricted uploads until an admin approves them.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: User hash created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "403":
          description: Public user-hash creation is disabled because uploads are restricted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/keys/me:
    get:
      tags: [Auth]
      operationId: getCurrentKey
      summary: Get current user hash details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Key prefix and usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/uploads:
    post:
      tags: [Uploads]
      operationId: createUploadIntent
      summary: Reserve quota and create a single-PUT or multipart session
      description: |
        Validates the declared name and size, reserves storage atomically, and
        returns a short-lived presigned PUT URL (mode=single) or multipart part
        metadata (mode=multipart). Authentication is optional when public
        uploads are enabled. When public uploads are disabled, a valid,
        non-revoked, admin-approved user hash is required. Single PUTs must use
        exactly the returned URL and headers. Multipart clients request part
        URLs, PUT each part, report its ETag, then call the complete endpoint.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name:
                  type: string
                  maxLength: 180
                size:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 5497558138880
                  description: Maximum is the provider object limit; the uploader's per-hash limit, instance default, and MAX_STORAGE still apply.
                content_type:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: Upload intent and presigned PUT URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntent"
        "400":
          description: Invalid name or size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Public uploads are disabled and no valid user hash was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Public uploads are disabled and the user hash is not approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File exceeds MAX_FILE_SIZE or the 5 GB single-PUT limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "507":
          description: Storage is at capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/uploads/{id}:
    get:
      tags: [Uploads]
      operationId: getUploadStatus
      summary: Get multipart upload status
      description: Requires X-Upload-Token. Returns the upload mode, state, part size/count, and completed part numbers.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadToken"
      responses:
        "200":
          description: Current upload state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Upload token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Upload expired or is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Uploads]
      operationId: abortUpload
      summary: Abort a pending upload
      description: Aborts an in-progress multipart upload, deletes any staging object, releases the quota reservation, and closes the intent. Requires X-Upload-Token.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadToken"
      responses:
        "204":
          description: Upload closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Upload token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Upload was already committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/uploads/{id}/parts:
    post:
      tags: [Uploads]
      operationId: createUploadPartURLs
      summary: Request presigned multipart part URLs
      description: Requires X-Upload-Token. Returns between 1 and 100 short-lived part URLs.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_numbers]
              properties:
                part_numbers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                    maximum: 10000
      responses:
        "200":
          description: Presigned part URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartURLs"
        "400":
          description: Invalid part numbers, or the upload is not multipart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Upload expired or is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/uploads/{id}/parts/{n}:
    put:
      tags: [Uploads]
      operationId: reportUploadPart
      summary: Record a multipart part ETag
      description: Requires X-Upload-Token. Records the ETag and exact size returned by the part PUT. Non-final parts must equal part_size; the final part must equal the remaining bytes.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadToken"
        - $ref: "#/components/parameters/PartNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etag, size]
              properties:
                etag:
                  type: string
                  maxLength: 256
                size:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "204":
          description: Part recorded.
        "400":
          description: Invalid part number, ETag, size, or upload mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Upload expired or is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/uploads/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Verify and commit an uploaded object
      description: |
        Requires X-Upload-Token. In multipart mode, verifies provider-side part
        sizes/ETags, assembles the reported parts, and uses the staging key as
        the live object. Single PUTs are copied to an unexposed live key. Then
        performs a HEAD, verifies actual size against the declared size and
        configured cap, consumes the quota reservation, and inserts the file
        record. Retrying a committed upload returns the existing file.
      parameters:
        - $ref: "#/components/parameters/UploadID"
        - $ref: "#/components/parameters/UploadToken"
      responses:
        "200":
          description: The upload was already committed; existing file returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedUpload"
        "201":
          description: File committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Upload token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The PUT has not reached S3 yet, or multipart parts are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Upload window expired or intent is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Actual object is larger than declared or allowed, or a provider part does not match its declared size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List the current user hash's active files
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of files.
          content:
            application/json:
              schema:
                type: object
                required: [files, pagination]
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/files/{id}:
    get:
      tags: [Files]
      operationId: getFileMetadata
      summary: Get public file metadata
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a committed file
      description: Requires either the owning user hash or the per-file delete token returned by the upload intent.
      parameters:
        - $ref: "#/components/parameters/FileID"
        - name: X-Delete-Token
          in: header
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
        - {}
      responses:
        "204":
          description: File deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Invalid delete token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/files/{id}/download:
    post:
      tags: [Files]
      operationId: createDownloadLink
      summary: Create a short-lived download URL
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: A short-lived signed S3 GET URL or worker-proxied token URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A user hash in the form interim_..."
  parameters:
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UploadID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UploadToken:
      name: X-Upload-Token
      in: header
      required: true
      schema:
        type: string
    PartNumber:
      name: n
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
  responses:
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: File, upload, or endpoint not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The file retention period has ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    File:
      type: object
      required: [id, name, size, content_type, created_at, expires_at, expires_in_seconds, never_expires, page_url, api_url, owner]
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
          format: int64
          description: Seconds until expiry; 0 when never_expires is true or the file has expired.
        never_expires:
          type: boolean
          description: True when the uploader's user hash has unlimited retention; expires_at is a far-future sentinel.
        page_url:
          type: string
          format: uri
        api_url:
          type: string
          format: uri
        owner:
          type: string
          enum: [anonymous, user_hash]
    UploadIntent:
      type: object
      required:
        [upload_id, mode, expires_at, intent_expires_at, upload_token, complete_url, abort_url, delete_token, delete_token_header, warning]
      properties:
        upload_id:
          type: string
        mode:
          type: string
          enum: [single, multipart]
        url:
          type: string
          format: uri
          description: Presigned S3 PUT URL. Present for single mode.
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
          description: Required request headers for a single PUT.
        part_size:
          type: integer
          format: int64
          minimum: 5242880
          maximum: 5368709120
          description: Multipart part size in bytes. The server may raise the configured value to stay under 10,000 parts.
        part_count:
          type: integer
          minimum: 1
          maximum: 10000
          description: Number of parts required for a multipart upload.
        concurrency:
          type: integer
          description: Suggested browser part parallelism.
        parts_url:
          type: string
          format: uri
          description: Endpoint for requesting presigned part URLs.
        status_url:
          type: string
          format: uri
          description: Endpoint for multipart status and completed part numbers.
        expires_at:
          type: string
          format: date-time
          description: Expiry of the presigned PUT URL.
        intent_expires_at:
          type: string
          format: date-time
          description: Deadline for completion.
        upload_token:
          type: string
          description: Bearer token for complete/abort until the intent expires; never put it in a URL.
        complete_url:
          type: string
          format: uri
        abort_url:
          type: string
          format: uri
        delete_token:
          type: string
          description: Shown once. Required to delete an anonymous file.
        delete_token_header:
          type: string
          const: X-Delete-Token
        warning:
          type: string
    UploadStatus:
      type: object
      required: [upload_id, mode, state, completed_parts, expires_at, complete_url, abort_url]
      properties:
        upload_id:
          type: string
        mode:
          type: string
          enum: [single, multipart]
        state:
          type: string
          enum: [pending, committed]
        part_size:
          type: integer
          format: int64
        part_count:
          type: integer
        concurrency:
          type: integer
        completed_parts:
          type: array
          items:
            type: integer
        expires_at:
          type: string
          format: date-time
        complete_url:
          type: string
          format: uri
        abort_url:
          type: string
          format: uri
        parts_url:
          type: string
          format: uri
    UploadPartURLs:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [part_number, url, expires_at]
            properties:
              part_number:
                type: integer
              url:
                type: string
                format: uri
              expires_at:
                type: string
                format: date-time
    CompletedUpload:
      type: object
      required: [upload_id, file]
      properties:
        upload_id:
          type: string
        file:
          $ref: "#/components/schemas/File"
    CreatedKey:
      type: object
      required: [id, user_hash, key_prefix, approved, created_at, max_file_size_bytes, retention_seconds, warning]
      properties:
        id:
          type: string
        user_hash:
          type: string
          description: Raw bearer credential. Returned once.
        key_prefix:
          type: string
        name:
          type: string
        approved:
          type: boolean
          description: Whether the hash may create uploads when public uploads are disabled.
        created_at:
          type: string
          format: date-time
        max_file_size_bytes:
          type: integer
          format: int64
          description: Per-hash file-size limit. 0 means unlimited; provider limits and MAX_STORAGE still apply.
        retention_seconds:
          type: integer
          format: int64
          description: Per-hash retention. 0 means the hash's files never expire.
        warning:
          type: string
    KeyInfo:
      type: object
      required: [id, key_prefix, approved, created_at, files, bytes, max_file_size_bytes, retention_seconds]
      properties:
        id:
          type: string
        key_prefix:
          type: string
        name:
          type: string
        approved:
          type: boolean
          description: Whether the hash may create uploads when public uploads are disabled.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        files:
          type: integer
        bytes:
          type: integer
          format: int64
        max_file_size_bytes:
          type: integer
          format: int64
          description: Per-hash file-size limit. 0 means unlimited; provider limits and MAX_STORAGE still apply.
        retention_seconds:
          type: integer
          format: int64
          description: Per-hash retention. 0 means the hash's files never expire.
    DownloadLink:
      type: object
      required: [url, filename, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived signed S3 URL or worker-proxied token URL.
        filename:
          type: string
        expires_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    Status:
      type: object
      required: [accepting_uploads, public_uploads, storage, retention_seconds, retention_human, retention_extend_on_download, max_file_size_bytes, download_url_ttl_seconds, server_time]
      properties:
        accepting_uploads:
          type: boolean
        public_uploads:
          type: boolean
          description: False when uploads require an admin-approved user hash.
        storage:
          type: object
          required: [files, used_bytes, reserved_bytes, limit_bytes, available_bytes, used_percent, unlimited]
          properties:
            files:
              type: integer
            used_bytes:
              type: integer
              format: int64
            reserved_bytes:
              type: integer
              format: int64
            limit_bytes:
              type: integer
              format: int64
              description: Configured global cap in bytes, or 0 when unlimited.
            available_bytes:
              type: integer
              format: int64
              description: Remaining capacity in bytes, or 0 when unlimited.
            used_percent:
              type: number
              format: double
            unlimited:
              type: boolean
              description: True when the global storage cap is disabled with MAX_STORAGE=0.
        retention_seconds:
          type: integer
          format: int64
        retention_human:
          type: string
        retention_extend_on_download:
          type: boolean
          description: True when each download-link request resets the file expiry to retention_seconds from that moment.
        max_file_size_bytes:
          type: integer
          format: int64
        download_url_ttl_seconds:
          type: integer
          format: int64
        server_time:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
