services:
  interim:
    build:
      context: .
    image: interim:latest
    container_name: interim
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Keep the Go listener off the public interfaces. Put Caddy,
      # cloudflared, or another trusted proxy in front of it.
      - "127.0.0.1:8080:8080"
    volumes:
      - interim-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 150s

volumes:
  interim-data:
